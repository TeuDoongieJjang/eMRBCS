workflow: GitHubFlow/v1
mode: ContinuousDelivery

increment: Patch

commit-message-incrementing: Enabled

patch-version-bump-message: '(?i)^(release-)?patch\b'

minor-version-bump-message: '(?i)^(release-)?minor\b'

major-version-bump-message: '(?i)^(release-)?major\b'

no-bump-message: '(?i)(\[skip ci\]|\+semver:\s?(none|skip))'

tag-prefix: 'v'