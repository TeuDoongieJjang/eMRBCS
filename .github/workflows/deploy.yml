name: Build and Release MAUI App

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-android

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SUBJECT="$(git log -1 --pretty=%s)"
          SUBJECT_LC="$(printf '%s' "$SUBJECT" | tr '[:upper:]' '[:lower:]')"
          RELEASE_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'

          IS_RELEASE=false
          BUMP=patch
          if [[ "$SUBJECT_LC" == release-* ]]; then
            IS_RELEASE=true
            case "$SUBJECT_LC" in
              release-major*) BUMP=major ;;
              release-minor*) BUMP=minor ;;
              release-patch*) BUMP=patch ;;
            esac
          fi

          LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -E "$RELEASE_RE" | head -n1 || true)"

          HEAD_TAG=""
          if [ "$IS_RELEASE" = "true" ]; then
            HEAD_TAG="$(git tag --points-at HEAD | grep -E "$RELEASE_RE" | head -n1 || true)"
          fi

          if [ -n "$HEAD_TAG" ]; then
            MMP="${HEAD_TAG#v}"
            FULL="$MMP"
          else
            if [ -z "$LAST_TAG" ]; then
              LAST_TAG="v0.0.0"
              COUNT="$(git rev-list --count HEAD)"
            else
              COUNT="$(git rev-list --count "${LAST_TAG}..HEAD")"
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"

            if [ "$IS_RELEASE" = "true" ]; then
              case "$BUMP" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              MMP="${MAJOR}.${MINOR}.${PATCH}"
              FULL="$MMP"
            else
              PATCH=$((PATCH + 1))
              MMP="${MAJOR}.${MINOR}.${PATCH}"
              FULL="${MMP}-${COUNT}"
            fi
          fi

          {
            echo "is_release=$IS_RELEASE"
            echo "major_minor_patch=$MMP"
            echo "version=$FULL"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$FULL" >> "$GITHUB_ENV"

          echo "Commit subject : $SUBJECT"
          echo "Last release   : ${LAST_TAG:-none}"
          echo "Release commit : $IS_RELEASE (bump: $BUMP)"
          echo "Version        : $FULL"

      - name: Show calculated version
        run: |
          echo "Selected version: ${{ env.VERSION }}"
          echo "Is release: ${{ steps.version.outputs.is_release }}"
          echo "Build number (run_number): ${{ github.run_number }}"

      - name: Prepare Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > emrbcs_app.keystore
          echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}"     >> $GITHUB_ENV
          echo "ANDROID_STORE_PASS=${{ secrets.ANDROID_STORE_PASS }}" >> $GITHUB_ENV

      - name: Build and publish
        run: |
          dotnet publish ./eMRBCS.csproj \
            -c Release -f net10.0-android \
            -p:ApplicationDisplayVersion=${{ env.VERSION }} \
            -p:ApplicationVersion=${{ github.run_number }}

      - name: Create tag if release commit
        if: steps.version.outputs.is_release == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${{ steps.version.outputs.major_minor_patch }}`;
            const { owner, repo } = context.repo;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              console.log(`Tag ${tag} already exists – skipping.`);
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({
                owner, repo, sha: context.sha, ref: `refs/tags/${tag}`
              });
              console.log(`Tag ${tag} created.`);
            }

      - name: Generate version manifest
        run: |
          APK_FILE=$(basename "$(ls bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -n1)" 2>/dev/null || true)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: no APK found in bin/Release/net10.0-android" >&2
            ls -la bin/Release/net10.0-android || true
            exit 1
          fi
          echo "Detected APK: $APK_FILE"

          cat > bin/Release/net10.0-android/version.json <<JSON
          {
            "versionName": "${{ env.VERSION }}",
            "versionCode": ${{ github.run_number }},
            "apkFileName": "$APK_FILE",
            "releaseNotes": "Release ${{ env.VERSION }} (build ${{ github.run_number }})"
          }
          JSON

          echo "----- version.json -----"
          cat bin/Release/net10.0-android/version.json
          echo "------------------------"

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.major_minor_patch }}
          name: Release v${{ steps.version.outputs.major_minor_patch }}
          allowUpdates: true
          files: |
            ./bin/Release/net10.0-android/*-Signed.apk
            ./bin/Release/net10.0-android/version.json

      - name: Create GitHub Pre-Release (non-release commit)
        if: steps.version.outputs.is_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pre-release v${{ steps.version.outputs.version }}
          prerelease: true
          allowUpdates: true
          files: |
            ./bin/Release/net10.0-android/*-Signed.apk
            ./bin/Release/net10.0-android/version.json